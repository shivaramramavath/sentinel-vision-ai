version: '3.9'

services:
  # ─── Kafka (KRaft mode — no ZooKeeper) ─────────────────────────────
  kafka:
    image: confluentinc/cp-kafka:7.7.1
    container_name: sentinel_kafka
    restart: unless-stopped
    ports:
      - '9092:9092'
      - '9094:9094'
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:29093'
      KAFKA_LISTENERS: 'PLAINTEXT://0.0.0.0:29092,CONTROLLER://0.0.0.0:29093,PLAINTEXT_HOST://0.0.0.0:9092'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_LOG_DIRS: '/tmp/kraft-combined-logs'
      CLUSTER_ID: 'MkU3OEVBNTcwNTJENDM2Qk'
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
    volumes:
      - kafka_kraft_data:/var/lib/kafka/data
    networks:
      - sentinel_net
    healthcheck:
      test: ['CMD', 'kafka-broker-api-versions', '--bootstrap-server', 'localhost:9092']
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 15s

  # ─── Kafka UI ──────────────────────────────────────────────────────
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: sentinel_kafka_ui
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - '8080:8080'
    environment:
      KAFKA_CLUSTERS_0_NAME: sentinel-kraft
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
    networks:
      - sentinel_net
    healthcheck:
      test: ['CMD', 'wget', '--no-verbose', '--tries=1', '--spider', 'http://localhost:8080/actuator/health']
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Redis ─────────────────────────────────────────────────────────
  redis:
    image: redis:7.4-alpine
    container_name: sentinel_redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    command: redis-server --requirepass "${REDIS_PASSWORD}" --appendonly yes --appendfsync everysec --loglevel warning
    volumes:
      - redis_data:/data
    networks:
      - sentinel_net
    healthcheck:
      test: ['CMD-SHELL', 'redis-cli -a "$$REDIS_PASSWORD" ping | grep PONG']
      interval: 5s
      timeout: 3s
      retries: 5

  # ─── MongoDB (Local Profile Only — Production/Dev uses MongoDB Atlas) ───
  mongodb:
    profiles:
      - local-mongo
    image: mongo:7.0
    container_name: sentinel_mongodb
    restart: unless-stopped
    ports:
      - '27017:27017'
    environment:
      MONGO_INITDB_DATABASE: sentinel_vision
    volumes:
      - mongodb_data:/data/db
      - ./mongo-init:/docker-entrypoint-initdb.d:ro
    networks:
      - sentinel_net
    healthcheck:
      test: ['CMD', 'mongosh', '--eval', 'db.adminCommand("ping")']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # ─── MinIO S3 Object Storage ───────────────────────────────────────
  minio:
    image: minio/minio:latest
    container_name: sentinel_minio
    restart: unless-stopped
    ports:
      - '9000:9000'
      - '9001:9001'
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ':9001'
    volumes:
      - minio_data:/data
    networks:
      - sentinel_net
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:9000/minio/health/live']
      interval: 10s
      timeout: 5s
      retries: 5

  minio-init:
    image: minio/mc:latest
    container_name: sentinel_minio_init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
        mc alias set local http://minio:9000 minioadmin minioadmin;
        mc mb --ignore-existing local/reference-photos;
        mc mb --ignore-existing local/sighting-thumbnails;
        mc mb --ignore-existing local/frame-crops;
        mc mb --ignore-existing local/camera-recordings;
        mc anonymous set download local/sighting-thumbnails;
        echo 'MinIO buckets initialised';
      "
    networks:
      - sentinel_net

  # ─── MediaMTX (Live RTSP/RTMP/WebRTC/SRT/HLS Ingest & Restream) ───
  mediamtx:
    image: bluenviron/mediamtx:latest
    container_name: sentinel_mediamtx
    restart: unless-stopped
    ports:
      - '8554:8554'          # RTSP
      - '1935:1935'          # RTMP
      - '8888:8888'          # HLS Low-Latency
      - '8889:8889'          # WebRTC Signaling / WHEP / WHIP
      - '8189:8189/udp'      # WebRTC Media UDP
      - '8890:8890/udp'      # SRT
      - '9997:9997'          # Control API (internal / dev)
    volumes:
      - ./mediamtx.yml:/mediamtx.yml:ro
    networks:
      - sentinel_net
    healthcheck:
      test: ['CMD', 'wget', '--spider', '-q', 'http://localhost:9997/v3/paths/list']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  # ─── Coturn (STUN/TURN NAT Traversal for WebRTC) ───────────────────
  coturn:
    image: coturn/coturn:latest
    container_name: sentinel_coturn
    restart: unless-stopped
    ports:
      - '3478:3478'
      - '3478:3478/tcp'
      - '49160-49200:49160-49200/udp'
    command:
      - -n
      - --log-file=stdout
      - --no-tls
      - --no-dtls
      - --use-auth-secret
      - --static-auth-secret=${TURN_SECRET}
      - --realm=sentinel.local
      - --min-port=49160
      - --max-port=49200
    networks:
      - sentinel_net

  # ─── Frame Sampler Service (Phase C2: FFmpeg Adaptive Sampling) ────
  frame-sampler:
    build:
      context: ../apps/frame-sampler
      dockerfile: Dockerfile
    container_name: sentinel_frame_sampler
    restart: unless-stopped
    depends_on:
      mediamtx:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      MEDIAMTX_API_URL: http://mediamtx:9997
      MEDIAMTX_RTSP_BASE: rtsp://mediamtx:8554
      KAFKA_BROKERS: kafka:29092
      TOPIC_FRAMES_RAW: frames.raw
      SAMPLE_FPS: '2.0'
    networks:
      - sentinel_net

  # ─── Recorder Service (Phase C3: Segmenting & MinIO Archival) ─────
  recorder:
    build:
      context: ../apps/recorder
      dockerfile: Dockerfile
    container_name: sentinel_recorder
    restart: unless-stopped
    depends_on:
      mediamtx:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      MEDIAMTX_API_URL: http://mediamtx:9997
      MEDIAMTX_RTSP_BASE: rtsp://mediamtx:8554
      MINIO_ENDPOINT: minio:9000
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
      MINIO_RECORDINGS_BUCKET: camera-recordings
      SEGMENT_SECONDS: '15'
      RECORDINGS_DIR: /tmp/sentinel_recordings
    volumes:
      - recorder_temp_data:/tmp/sentinel_recordings
    networks:
      - sentinel_net

  # ─── Prometheus ────────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: sentinel_prometheus
    restart: unless-stopped
    ports:
      - '9090:9090'
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks:
      - sentinel_net
    healthcheck:
      test: ['CMD', 'wget', '--no-verbose', '--tries=1', '--spider', 'http://localhost:9090/-/healthy']
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Grafana ───────────────────────────────────────────────────────
  grafana:
    image: grafana/grafana:11.2.0
    container_name: sentinel_grafana
    restart: unless-stopped
    ports:
      - '3002:3000'
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: 'false'
    volumes:
      - grafana_data:/var/lib/grafana
    networks:
      - sentinel_net
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:3000/api/health']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  kafka_kraft_data:
  redis_data:
  mongodb_data:
  minio_data:
  prometheus_data:
  grafana_data:
  recorder_temp_data:

networks:
  sentinel_net:
    driver: bridge
