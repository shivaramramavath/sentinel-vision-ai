apiVersion: apps/v1
kind: Deployment
metadata:
  name: sentinel-inference-gpu
  namespace: sentinel-vision
  labels:
    app: sentinel-inference-worker
    tier: gpu
spec:
  replicas: 2
  selector:
    matchLabels:
      app: sentinel-inference-worker
      tier: gpu
  template:
    metadata:
      labels:
        app: sentinel-inference-worker
        tier: gpu
    spec:
      nodeSelector:
        accelerator: nvidia-gpu
      tolerations:
        - key: "nvidia.com/gpu"
          operator: "Exists"
          effect: "NoSchedule"
      containers:
        - name: inference-worker
          image: sentinel-vision/inference:v1.0.0-gpu
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: sentinel-config
            - secretRef:
                name: sentinel-secrets
          env:
            - name: WORKER_POOL
              value: "gpu"
            - name: USE_FP16
              value: "true"
            - name: BATCH_SIZE
              value: "16"
          resources:
            requests:
              cpu: 2000m
              memory: 4Gi
              nvidia.com/gpu: 1
            limits:
              cpu: 4000m
              memory: 8Gi
              nvidia.com/gpu: 1
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 15
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sentinel-inference-cpu
  namespace: sentinel-vision
  labels:
    app: sentinel-inference-worker
    tier: cpu
spec:
  replicas: 2
  selector:
    matchLabels:
      app: sentinel-inference-worker
      tier: cpu
  template:
    metadata:
      labels:
        app: sentinel-inference-worker
        tier: cpu
    spec:
      containers:
        - name: inference-worker
          image: sentinel-vision/inference:v1.0.0-cpu
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: sentinel-config
            - secretRef:
                name: sentinel-secrets
          env:
            - name: WORKER_POOL
              value: "cpu"
            - name: USE_FP16
              value: "false"
          resources:
            requests:
              cpu: 1000m
              memory: 2Gi
            limits:
              cpu: 4000m
              memory: 4Gi
