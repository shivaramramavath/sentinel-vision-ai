[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sentinel-inference"
version = "0.0.0"
description = "Sentinel Vision AI — Inference Service"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.6",
    "uvicorn[standard]>=0.34.0",
    "aiokafka>=0.12.0",
    "pydantic>=2.10.4",
    "pydantic-settings>=2.7.1",
    "httpx>=0.28.1",
    "python-multipart>=0.0.20",
    "boto3>=1.35.99",
    "pinecone>=5.4.2",
    "numpy>=2.2.1",
    "Pillow>=11.1.0",
    "structlog>=25.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.4",
    "pytest-asyncio>=0.25.2",
    "httpx>=0.28.1",
    "ruff>=0.9.2",
    "mypy>=1.14.1",
]
torch = [
    "torch>=2.6.0",
    "torchvision>=0.21.0",
    "onnxruntime>=1.20.1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/sentinel_inference"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
